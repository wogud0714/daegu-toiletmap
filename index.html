 window.location.href=naverApp(t);
 setTimeout(()=>{document.removeEventListener('visibilitychange',onHide);if(!hidden&&!document.hidden)window.location.href=fallback},1500);
}
function openKakao(t){
 const fallback=kakaoWeb(t);
 if(!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){window.open(fallback,'_blank','noopener,noreferrer');return}
 let hidden=false;const onHide=()=>{if(document.hidden)hidden=true};document.addEventListener('visibilitychange',onHide);
 window.location.href=kakaoApp(t);
 setTimeout(()=>{document.removeEventListener('visibilitychange',onHide);if(!hidden&&!document.hidden)window.location.href=fallback},1500);
}
function update(){
 const origin=gpsPosition||places[selected];
 el('place-address').textContent=gpsPosition?'현재 GPS 좌표: '+origin.lat.toFixed(6)+', '+origin.lng.toFixed(6):origin.address;
 el('radius-name').textContent=radius===1000?'1km':radius+'m';
 const found=toilets.map(t=>({...t,d:distance(origin,t)})).filter(t=>t.d<=radius).sort((a,b)=>collator.compare(a.name,b.name)||a.d-b.d);
 el('count').textContent=found.length.toLocaleString('ko-KR');
 el('results').innerHTML=found.length?found.map((t,i)=>`<div class="item"><div class="top"><div class="name">${escapeHTML(t.name)}</div><div class="distance">${distanceText(t.d)}</div></div><div class="details">${escapeHTML(t.address||'주소 없음')}<div>개방시간: ${escapeHTML(t.hours||'-')} · 관리기관: ${escapeHTML(t.agency||'-')}</div>${t.phone?'<div>연락처: '+escapeHTML(t.phone)+'</div>':''}</div><div class="map-actions"><a class="map-link naver" data-provider="naver" data-index="${i}" href="${escapeHTML(naverWeb(t))}" target="_blank" rel="noopener noreferrer">네이버 지도 ↗</a><a class="map-link kakao" data-provider="kakao" data-index="${i}" href="${escapeHTML(kakaoWeb(t))}" target="_blank" rel="noopener noreferrer">카카오맵 ↗</a></div></div>`).join(''):'<div class="empty">선택한 반경 안에 등록된 화장실이 없습니다.</div>';
 el('results').querySelectorAll('.map-link').forEach(n=>n.addEventListener('click',e=>{e.preventDefault();const t=found[Number(n.dataset.index)];if(n.dataset.provider==='kakao')openKakao(t);else openNaver(t)}));
}
places.map((p,i)=>({p,i})).sort((a,b)=>collator.compare(a.p.name,b.p.name)).forEach(({p,i})=>el('place').add(new Option(p.name,String(i))));
el('place').value=String(selected);
el('place').addEventListener('change',e=>{selected=Number(e.target.value);gpsPosition=null;el('gps-status').textContent='배치장소를 중심으로 검색합니다.';update()});
el('radius').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{radius=Number(btn.dataset.radius);el('radius').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));update()}));
el('gps').addEventListener('click',()=>{
 if(!window.isSecureContext){el('gps-status').textContent='GPS는 HTTPS(GitHub Pages 등)에서만 사용할 수 있습니다.';return}
 if(!navigator.geolocation){el('gps-status').textContent='이 브라우저는 GPS 위치 확인을 지원하지 않습니다.';return}
 const btn=el('gps');btn.disabled=true;el('gps-status').textContent='현재 위치 확인 중입니다. 위치 접근을 허용해 주세요.';
 navigator.geolocation.getCurrentPosition(pos=>{btn.disabled=false;const {latitude,longitude,accuracy}=pos.coords;gpsPosition={lat:latitude,lng:longitude};el('gps-status').textContent='현재 위치 확인 완료 (추정 오차 ±'+Math.round(accuracy)+'m)';update()},err=>{btn.disabled=false;el('gps-status').textContent=({1:'위치 권한이 거부되었습니다. 브라우저 설정을 확인하세요.',2:'위치를 확인하지 못했습니다. 위치 서비스를 켜 주세요.',3:'위치 확인 시간이 초과됐습니다. 다시 시도해 주세요.'})[err.code]||'GPS 위치 확인 실패'},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
update();
</script></body></html>
